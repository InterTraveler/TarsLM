# TarsLM 快速调试配置
# 适用场景: 本地开发快速验证 loss 收敛 / 梯度正常 / 无 NaN，约 1 分钟完成
# 模型规模: 极小参数（~4.35M），秒级启动
# 数据来源: 项目内置 data/train_data/ 目录下的示例语料
# 启动命令: python main_pretrain.py --config config/default.yaml
# ==================== 模型架构参数 ====================
model:
  # 词表大小（需与分词器实际词表一致）
  vocab_size: 1000
  # 隐藏层维度
  hidden_size: 192
  # Transformer 层数
  num_layers: 4
  # 注意力头数
  num_attention_heads: 6
  # KV 头数（MHA 模式，调试阶段不引入 GQA 变量）
  num_key_value_heads: 6
  # 前馈网络中间层维度（4x hidden_size，SwiGLU 标准比例）
  intermediate_size: 768
  # 最大序列长度
  max_seq_len: 256
  # RMSNorm epsilon
  norm_eps: 1.0e-6
  # 注意力 dropout（调试阶段关闭，加速收敛）
  attention_dropout: 0.0
  # 残差 dropout（调试阶段关闭）
  hidden_dropout: 0.0
  # RoPE 旋转基频
  rope_theta: 10000.0


# ==================== MoE（混合专家）参数 ====================
moe:
  enabled: true
  num_experts: 2
  top_k: 1
  load_balance_weight: 0.01
  router_z_loss_weight: 0.0


# ==================== 硬件适配 ====================
hardware:
  # 调试阶段关闭梯度检查点（小模型显存不紧张，开启反而拖慢调试）
  enable_gradient_checkpointing: false


# ==================== 预训练专属配置 ====================
pretrain:
  # ---------- 训练超参 ----------
  training:
    # 每 GPU 批量大小
    batch_size: 2
    # 梯度累积步数
    gradient_accumulation_steps: 2
    # 初始学习率
    learning_rate: 3.0e-4
    # 学习率预热步数
    warmup_steps: 10
    # 总训练步数
    max_steps: 100
    # 学习率调度器: cosine / linear / constant
    lr_scheduler: "cosine"
    # 梯度裁剪最大范数
    max_grad_norm: 1.0
    # AdamW 权重衰减（调试阶段可关闭，聚焦 loss 下降速度）
    weight_decay: 0.0
    # Adam 一阶矩衰减系数
    adam_beta1: 0.9
    # Adam 二阶矩衰减系数
    adam_beta2: 0.95
    # Adam 数值稳定项
    adam_epsilon: 1.0e-8
    # 日志打印间隔（步数，高频观察 loss 趋势）
    log_interval: 5
    # checkpoint 保存间隔（步数）
    save_interval: 25
    # 评估间隔（步数）
    eval_interval: 25
    # 最多保留 checkpoint 数
    keep_checkpoint_max: 2
    # 是否启用混合精度训练（调试阶段关闭，避免 fp16 数值问题干扰排查）
    use_mixed_precision: false
    # 混合精度类型: fp16 / bf16
    precision: "fp16"
  

  # ---------- 数据集 ----------
  dataset:
    # 预训练语料路径
    train_data_path: "./data/train_data/multi/"
    # 分词器路径
    tokenizer_path: "./data/tokenizer/"
    # 语料格式，必填；只递归加载该格式文件，例如 json / jsonl / txt / parquet
    data_format: json
    # 数据加载子进程数
    num_workers: 0
  

  # ---------- 路径 ----------
  paths:
    # checkpoint 保存目录
    checkpoint_dir: "./checkpoints/"
  

# ==================== 微调专属配置 ====================
finetune:
  # 预训练 checkpoint 目录（自动选择步数最大的 checkpoint-n）
  pretrained_checkpoint: "./checkpoints/"
  # 以下字段覆盖预训练配置中的同名字段，用于微调场景
  training:
    # 微调关闭梯度累积（对话数据少，每步更新更有效）
    gradient_accumulation_steps: 1
    # 微调学习率低于预训练（避免灾难性遗忘）
    learning_rate: 2.0e-4
    # 调试微调步数
    max_steps: 50
    # 微调少量正则化
    weight_decay: 0.01
    # 日志打印间隔
    log_interval: 20
    # checkpoint 保存间隔
    save_interval: 50
    # 评估间隔
    eval_interval: 25
  dataset:
    # 对话语料路径（项目内置 chat/ 目录）
    train_data_path: "./data/train_data/chat/"
  paths:
    # 微调产物输出目录
    checkpoint_dir: "./checkpoints_chat/"
