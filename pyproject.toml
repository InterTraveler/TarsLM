[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarslm"
version = "0.1.0"
description = "A small decoder-only LLM training and inference project."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1.0,<3.0.0",
    "transformers>=4.45.0,<6.0.0",
    "datasets>=2.16.0,<6.0.0",
    "accelerate>=0.25.0",
    "huggingface_hub>=0.20.0",
    "tokenizers>=0.19.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0,<3.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.14.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pylint>=3.0.0",
    "pyright>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["model*", "common*", "data*"]

[tool.setuptools]
py-modules = [
    "main_pretrain",
    "chat_finetune",
    "chat",
    "eval",
    "train_tokenizer",
    "bootstrap",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pylint.main]
ignore = ["tests"]
