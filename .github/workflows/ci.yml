name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 固定 HF 缓存目录并强制离线，保证测试在任何环境（包括无外网 runner）下可复现。
env:
  HF_HOME: ${{ runner.temp }}/hf_home
  HF_DATASETS_CACHE: ${{ runner.temp }}/hf_home/datasets
  HF_HUB_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 先装 CPU 版 PyTorch（与本地验证一致的 2.6.0），避免拉取数 GB 的 CUDA 包；
      # requirements.txt 中的 torch>=2.1.0,<3.0.0 随后会被视为已满足而跳过。
      - name: Install CPU-only PyTorch
        run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/ -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # 锁定 ruff 主版本，避免未来版本新增规则导致 CI 意外变红。
      - name: Install ruff
        run: pip install "ruff>=0.6,<0.17"
      - name: Run ruff check
        run: ruff check .
